on:
  push:
    branches:
    - main
  pull_request:

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [
          "Release_2021.1.9", "Release_2023.0.0", "Release_2025.0.0"
        ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
    - name: Execute build and run tests
      run: |
        dotnet build --configuration "${{ matrix.configuration }}" /nologo
        dotnet test --configuration "${{ matrix.configuration }}"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VolocyNazad.Revit.MediatR
        path: artifacts/*
    - name: Check if commit is tagged
      id: tag_check
      run: |
        # git tag --points-at всегда завершается с кодом 0 (в отличие от git describe --exact-match,
        # который пишет в stderr и возвращает 1, если тега нет — это валит шаг на GH Actions даже
        # при $ErrorActionPreference = "Continue").
        $tags = git tag --points-at HEAD
        if ($tags) {
            echo "is_tagged=true" >> $env:GITHUB_OUTPUT
        } else {
            echo "is_tagged=false" >> $env:GITHUB_OUTPUT
        }
    - name: Publish NuGet package
      if: github.event_name == 'push' && steps.tag_check.outputs.is_tagged == 'true'
      run: |
        foreach($file in (Get-ChildItem "artifacts/" -Recurse -Include *.nupkg)) {
            dotnet nuget push $file --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        }
